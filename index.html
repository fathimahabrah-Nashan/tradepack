<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TradePack – Trading & Repacking Manager</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#6b7385;--bd:#e2e5ec;--ac:#1f6feb;--ok:#14884a;--bad:#c93232;--warn:#b7791f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b202b;--tx:#e8ebf2;--mut:#98a1b5;--bd:#2c3342;--ac:#5b9bff;--ok:#38c172;--bad:#ff6b6b;--warn:#e0a84a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b202b;--tx:#e8ebf2;--mut:#98a1b5;--bd:#2c3342;--ac:#5b9bff;--ok:#38c172;--bad:#ff6b6b;--warn:#e0a84a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header h1{font-size:17px;margin:0;margin-right:auto}
.app{display:flex}.wrap{flex:1;min-width:0}
aside#nav{width:210px;flex:none;background:#1b2740;color:#cfd8ea;padding:14px 10px;display:flex;flex-direction:column;gap:4px}
aside#nav .br{font-weight:700;font-size:17px;color:#fff;padding:6px 10px 16px}
aside#nav button{border:0;background:none;color:#cfd8ea;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer;font:inherit}
aside#nav button.on{background:#2f6df0;color:#fff}
@media(max-width:800px){.app{flex-direction:column}aside#nav{width:auto;flex-direction:row;overflow-x:auto;padding:8px}aside#nav .br{display:none}aside#nav button{white-space:nowrap}}
main{max-width:1200px;margin:0 auto;padding:16px}
.grid .card,.d3 .card{margin:0}
.d3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:12px}
.kc{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--kc) 13%,var(--card));border-color:color-mix(in srgb,var(--kc) 30%,var(--bd))}
.kc .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--kc) 25%,var(--card));flex:none}
.kc small{color:var(--mut);display:block}.kc b{font-size:20px;display:block}.sb{font-size:12px;color:var(--mut)}
.dn{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.lg{flex:1;min-width:130px;font-size:13px}.lg div{display:flex;align-items:center;gap:6px;padding:2px 0}.lg i{width:9px;height:9px;border-radius:50%;flex:none}.lg b{margin-left:auto}
.st{padding:2px 10px;border-radius:6px;font-size:12px;font-weight:600}.st.g{background:#d9f5e5;color:#14804a}.st.a{background:#fdf0cf;color:#9a6a00}.st.r{background:#fde0e0;color:#c02a2a}
.rt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rt div{background:color-mix(in srgb,var(--ac) 10%,var(--card));border-radius:10px;padding:10px}.rt small{color:var(--mut);display:block}.rt b{font-size:20px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:21px}
h2{font-size:15px;margin:0 0 10px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:480px}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px}
td.n,th.n{text-align:right}
input,select,button.b{font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
button.b{background:var(--ac);color:#fff;border:0;cursor:pointer}
button.b:disabled{opacity:.55;cursor:wait}
button.b.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
form{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
.lines{width:100%;display:flex;flex-direction:column;gap:6px}.lr{display:flex;gap:6px;flex-wrap:wrap}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.chart{display:flex;align-items:flex-end;gap:14px;height:150px;padding-top:8px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars{display:flex;gap:3px;align-items:flex-end;height:120px;width:100%;justify-content:center}
.bars i{width:40%;max-width:26px;border-radius:4px 4px 0 0;display:block}
.pill{padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid var(--bd)}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.note{color:var(--mut);font-size:12px;margin:6px 0 0}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;display:none;max-width:90vw;z-index:50}
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
#login .card{width:100%;max-width:360px;padding:22px}
#login form{flex-direction:column;align-items:stretch}
#login h1{font-size:20px;margin:0 0 4px}
#login .msg{margin-top:10px;font-size:13px}
.hide{display:none!important}
</style>
</head>
<body>

<!-- Sign-in screen -->
<div id="login" class="hide">
  <div class="card">
    <h1>📦 TradePack</h1>
    <div class="note" style="margin:0 0 14px">Trading &amp; Repacking Manager – sign in to continue</div>
    <form onsubmit="return doLogin(event)">
      <label>Email<input type="email" name="e" autocomplete="username" required></label>
      <label>Password<input type="password" name="p" autocomplete="current-password" required></label>
      <button class="b">Sign in</button>
    </form>
    <div id="lmsg" class="msg bad"></div>
  </div>
</div>

<!-- Waiting-for-approval screen -->
<div id="pending" class="hide" style="min-height:100vh;display:grid;place-items:center;padding:16px">
  <div class="card" style="max-width:380px"><h2>Waiting for approval</h2>
    <p>Your account is created, but the owner has not given you a role yet. Ask the owner to open <b>Users</b> and approve you, then press Refresh.</p>
    <button class="b" onclick="boot()">Refresh</button> <button class="b g" onclick="doLogout()">Sign out</button></div>
</div>

<!-- Main app -->
<div class="app hide" id="app"><aside id="nav"></aside><div class="wrap">
  <header><h1 id="ttl">Dashboard</h1><span id="asat" style="color:var(--mut)"></span>
    <span class="pill" id="who"></span>
    <button class="b g" onclick="refresh()">↻ Refresh</button>
    <button class="b g" onclick="backup()">⬇ Backup</button>
    <button class="b g" onclick="doLogout()">Sign out</button></header>
  <main id="v"></main></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ============ 1. CONFIG – paste your two values from Supabase → Project Settings → API ============ */
const SUPABASE_URL=sb_publishable_E6wnFfAbWkCvOrz8eGALWg_4UQon4yN;            // e.g. https://abcdxyz.supabase.co
const SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';  // the "anon / public" key (safe to publish – RLS protects the data)
/* ================================================================================================ */

const $=id=>document.getElementById(id);
const show=(id,on)=>$(id).classList.toggle('hide',!on);
const configured=!SUPABASE_URL.startsWith('YOUR_')&&!SUPABASE_ANON_KEY.startsWith('YOUR_');
const sb=configured?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;

const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const D=n=>{const d=new Date();d.setDate(d.getDate()-n);return ymd(d)};
const TODAY=D(0);
const f=n=>(+n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const f0=n=>Math.round(+n||0).toLocaleString();
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ALL_TABS=[['dash','Dashboard'],['sales','Sales & Receipts'],['ar','AR Ledger & Ageing'],['stock','Inventory'],['repack','Repacking'],['exp','Expenses & Profit'],['users','Users']];
const TABS_BY_ROLE={owner:['dash','sales','ar','stock','repack','exp','users'],accountant:['dash','sales','ar','stock','repack','exp'],sales:['sales','ar','stock','repack']};
const IC={dash:'📊',sales:'🧾',ar:'👥',stock:'📦',repack:'🏭',exp:'💸',users:'🔑'};

let S={tab:'dash',cust:null,period:'month',items:[],custs:[],inv:[],rec:[],exp:[],pur:[],rp:[],users:[]};
let ME=null; // {id,email,role}
const can=(...r)=>!!ME&&r.includes(ME.role);
const item=i=>S.items.find(x=>x.id==i),cust=i=>S.custs.find(x=>x.id==i);

function toast(m,ms=2500){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms)}
function savePrefs(){try{localStorage.setItem('tradepack_prefs',JSON.stringify({tab:S.tab,period:S.period}))}catch(e){}}
function loadPrefs(){try{const p=JSON.parse(localStorage.getItem('tradepack_prefs')||'{}');if(p.tab)S.tab=p.tab;if(p.period)S.period=p.period}catch(e){}}

/* ============ 2. Data access ============ */
async function fetchAll(table){ // pages through the 1000-row API limit
  let out=[],from=0;
  for(;;){const{data,error}=await sb.from(table).select('*').order('id').range(from,from+999);
    if(error)throw error;out=out.concat(data);if(data.length<1000)break;from+=1000}
  return out}
async function loadAll(){
  const [it,cu,iv,rc,ex,pu,rp]=await Promise.all(['items','customers','invoices','receipts','expenses','purchases','repacks'].map(fetchAll));
  S.items=it.map(x=>({id:x.id,name:x.name,type:x.type,unit:x.unit,qty:+x.qty,cost:+x.cost,min:+x.min_qty,bulk:x.bulk_id,size:+x.pack_size||1}));
  S.custs=cu.map(x=>({id:x.id,name:x.name,limit:+x.credit_limit,terms:+x.terms}));
  S.inv=iv.map(x=>({id:x.id,no:x.no,cust:x.customer_id,date:x.inv_date,due:x.due_date,lines:(x.lines||[]).map(l=>({i:l.i,q:+l.q,p:+l.p,c:+l.c})),total:+x.total}));
  S.rec=rc.map(x=>({id:x.id,cust:x.customer_id,date:x.rec_date,amt:+x.amount,bank:x.bank}));
  S.exp=ex.map(x=>({id:x.id,cat:x.cat,date:x.exp_date,amt:+x.amount}));
  S.pur=pu.map(x=>({id:x.id,date:x.pur_date,sup:x.supplier,item:x.item_id,qty:+x.qty,cost:+x.cost}));
  S.rp=rp.map(x=>({id:x.id,date:x.rp_date,pack:x.pack_id,n:+x.n,waste:+x.waste,mat:+x.material}));
  if(!S.custs.find(c=>c.id==S.cust))S.cust=S.custs.length?S.custs[0].id:null;
  if(can('owner')){const{data,error}=await sb.from('profiles').select('*').order('email');if(error)throw error;S.users=data}
}
// run a write, reload shared data, re-render. Disables the submit button to prevent double posts.
async function run(e,fn,okMsg){
  const btn=e&&e.target&&e.target.querySelector('button:not([type=button])');if(btn)btn.disabled=true;
  try{await fn();await loadAll();go(S.tab);if(okMsg)toast(okMsg)}
  catch(err){toast(err.message||'Something went wrong',4500);if(btn)btn.disabled=false}
  return false}
async function refresh(){try{await loadAll();go(S.tab);toast('Up to date')}catch(e){toast(e.message,4000)}}

/* ============ 3. Auth ============ */
async function doLogin(e){e.preventDefault();$('lmsg').textContent='';const F=e.target,b=F.querySelector('button');b.disabled=true;
  const{error}=await sb.auth.signInWithPassword({email:F.e.value.trim(),password:F.p.value});b.disabled=false;
  if(error){$('lmsg').textContent=error.message;return false}
  await boot();return false}
async function doLogout(){await sb.auth.signOut();ME=null;S.items=S.custs=S.inv=S.rec=S.exp=S.pur=S.rp=[];show('app',false);show('pending',false);show('login',true)}
async function boot(){
  if(!configured){show('login',true);$('lmsg').innerHTML='Setup needed: open <b>index.html</b> and paste your Supabase URL and anon key at the top of the script.';return}
  const{data:{session}}=await sb.auth.getSession();
  if(!session){show('app',false);show('pending',false);show('login',true);return}
  const{data:p,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(error||!p){show('login',true);$('lmsg').textContent=(error&&error.message)||'No profile found for this account – run schema.sql first.';return}
  ME={id:p.id,email:p.email||session.user.email,role:p.role};
  show('login',false);
  if(ME.role==='pending'){show('app',false);show('pending',true);return}
  show('pending',false);
  try{await loadAll()}catch(e){toast('Could not load data: '+e.message,6000)}
  loadPrefs();
  show('app',true);
  const tabs=TABS_BY_ROLE[ME.role]||[];if(!tabs.includes(S.tab))S.tab=tabs[0];
  $('who').textContent=ME.email+' · '+ME.role;
  go(S.tab);
}
function backup(){const d={exported:new Date().toISOString(),customers:S.custs,items:S.items,invoices:S.inv,receipts:S.rec,expenses:S.exp,purchases:S.pur,repacks:S.rp};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='tradepack-backup-'+TODAY+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

/* ============ 4. Business calculations (unchanged from demo) ============ */
// FIFO allocation of receipts to invoices per customer
function ar(){const rows=[];S.custs.forEach(c=>{let pool=S.rec.filter(r=>r.cust==c.id).reduce((a,r)=>a+r.amt,0);
  S.inv.filter(i=>i.cust==c.id).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id).forEach(i=>{const paid=Math.min(i.total,pool);pool-=paid;
  const out=i.total-paid;const age=Math.floor((new Date(TODAY)-new Date(i.date))/864e5);rows.push({...i,paid,out,age,over:Math.floor((new Date(TODAY)-new Date(i.due))/864e5)})})});return rows}
const bucket=a=>a<=30?0:a<=60?1:a<=90?2:3;
const inPeriod=d=>S.period=='all'||d.slice(0,7)==TODAY.slice(0,7);
function totals(){const sales=S.inv.filter(i=>inPeriod(i.date)),cogs=sales.reduce((a,i)=>a+i.lines.reduce((b,l)=>b+l.q*l.c,0),0),sv=sales.reduce((a,i)=>a+i.total,0);
  const col=S.rec.filter(r=>inPeriod(r.date)).reduce((a,r)=>a+r.amt,0),ex=S.exp.filter(e=>inPeriod(e.date)).reduce((a,e)=>a+e.amt,0);
  return{sv,cogs,gp:sv-cogs,col,ex,np:sv-cogs-ex}}

/* ============ 5. Views ============ */
function go(t){S.tab=t;savePrefs();
  const tabs=TABS_BY_ROLE[ME.role]||[];
  $('nav').innerHTML='<div class="br">📦 TradePack</div>'+tabs.map(k=>`<button class="${k==t?'on':''}" onclick="go('${k}')">${IC[k]} ${ALL_TABS.find(x=>x[0]==k)[1]}</button>`).join('');
  $('ttl').textContent=ALL_TABS.find(x=>x[0]==t)[1];$('asat').textContent='As at '+TODAY;$('v').innerHTML=V[t]()}
const perSel=()=>`<label style="display:inline-flex">Period<select onchange="S.period=this.value;go(S.tab)"><option value="month" ${S.period=='month'?'selected':''}>This month</option><option value="all" ${S.period=='all'?'selected':''}>All time</option></select></label>`;
const bulkOpts=()=>S.items.filter(i=>i.type=='bulk').map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('');

const V={
sales(){
  if(!S.custs.length||!S.items.length)return`<div class="card"><h2>Nothing to sell yet</h2><p>${!S.custs.length?'Add a customer in <b>AR Ledger &amp; Ageing</b>. ':''}${!S.items.length?'Add stock items in <b>Inventory</b>.':''}</p></div>`;
  const opts=S.custs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  const list=[...S.inv].sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.id-a.id).slice(0,12),rr=Object.fromEntries(ar().map(r=>[r.id,r]));
  return`<div class="two"><div class="card"><h2>New invoice</h2><form onsubmit="return addInv(event)"><label>Customer<select name="c">${opts}</select></label><label>Date<input type="date" name="d" value="${TODAY}"></label><div class="lines" id="lines">${line()}</div><button type="button" class="b g" onclick="document.getElementById('lines').insertAdjacentHTML('beforeend',line())">+ Add line</button><button class="b">Create invoice</button></form></div>
<div class="card"><h2>Receive payment</h2><form onsubmit="return addRec(event)"><label>Customer<select name="c">${opts}</select></label><label>Date<input type="date" name="d" value="${TODAY}"></label><label>Amount<input type="number" step="0.01" min="0.01" name="a" required></label><label>Bank<select name="bk"><option>BOC</option><option>Sampath</option><option>HNB</option><option>Commercial</option><option>Cash</option></select></label><button class="b">Record receipt</button></form><div class="note">Receipts are auto-applied to the oldest invoices first.</div></div></div>
<div class="card"><h2>Recent invoices</h2><div class="scroll"><table><tr><th>No</th><th>Date</th><th>Customer</th><th class="n">Total</th><th class="n">Paid</th><th class="n">Balance</th><th>Status</th></tr>${list.map(i=>{const r=rr[i.id];return`<tr><td>${esc(i.no)}</td><td>${i.date}</td><td>${esc(cust(i.cust).name)}</td><td class="n">${f(i.total)}</td><td class="n">${f(r.paid)}</td><td class="n">${f(r.out)}</td><td>${r.out<=0.005?'<span class="ok">Paid</span>':r.over>0?`<span class="bad">Overdue ${r.over}d</span>`:r.paid>0?'<span class="warn">Partial</span>':'Open'}</td></tr>`}).join('')||'<tr><td colspan=7>No invoices yet</td></tr>'}</table></div></div>`},
ar(){const rows=ar(),c=S.cust;
  const sum=S.custs.map(x=>{const r=rows.filter(i=>i.cust==x.id),b=[0,0,0,0];r.forEach(i=>{if(i.out>0)b[bucket(i.age)]+=i.out});const o=b.reduce((a,v)=>a+v,0);return{x,b,o}});
  const tb=[0,1,2,3].map(k=>sum.reduce((a,s)=>a+s.b[k],0));
  const ev=[...S.inv.filter(i=>i.cust==c).map(i=>({d:i.date,t:'Invoice '+i.no,dr:i.total,cr:0})),...S.rec.filter(r=>r.cust==c).map(r=>({d:r.date,t:'Receipt',dr:0,cr:r.amt}))].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);let bal=0;
  return`<div class="card"><h2>Ageing report</h2><div class="scroll"><table><tr><th>Customer</th><th class="n">0–30</th><th class="n">31–60</th><th class="n">61–90</th><th class="n">90+</th><th class="n">Total</th><th class="n">Limit</th></tr>${sum.map(s=>`<tr><td>${esc(s.x.name)}</td>${s.b.map((v,k)=>`<td class="n ${k>1&&v?'bad':''}">${f(v)}</td>`).join('')}<td class="n"><b>${f(s.o)}</b></td><td class="n ${s.o>s.x.limit?'bad':''}">${f(s.x.limit)}</td></tr>`).join('')||'<tr><td colspan=7>No customers yet</td></tr>'}<tr><th>Total</th>${tb.map(v=>`<th class="n">${f(v)}</th>`).join('')}<th class="n">${f(tb.reduce((a,v)=>a+v,0))}</th><th></th></tr></table></div></div>
<div class="card"><h2>Customer ledger</h2>${S.custs.length?`<label style="margin-bottom:8px;max-width:280px">Customer<select onchange="S.cust=+this.value;go('ar')">${S.custs.map(x=>`<option value="${x.id}" ${x.id==c?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><div class="scroll"><table><tr><th>Date</th><th>Particulars</th><th class="n">Debit</th><th class="n">Credit</th><th class="n">Balance</th></tr>${ev.map(e=>{bal+=e.dr-e.cr;return`<tr><td>${e.d}</td><td>${esc(e.t)}</td><td class="n">${e.dr?f(e.dr):''}</td><td class="n ok">${e.cr?f(e.cr):''}</td><td class="n">${f(bal)}</td></tr>`}).join('')}</table></div>`:'<div class="note">Add a customer below to start.</div>'}</div>
<div class="card"><h2>Add customer</h2><form onsubmit="return addCust(event)"><label>Name<input name="n" required></label><label>Credit limit<input name="l" type="number" min="0" value="10000"></label><label>Terms (days)<input name="t" type="number" min="0" value="30"></label><button class="b">Add</button></form></div>`},
stock(){const fin=can('owner','accountant');
  return`<div class="card"><h2>Stock position</h2><div class="scroll"><table><tr><th>Item</th><th>Type</th><th class="n">Qty</th><th class="n">Avg cost</th><th class="n">Value</th><th>Status</th></tr>${S.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.type=='bulk'?'Bulk':'Packed'}</td><td class="n">${f(i.qty)} ${esc(i.unit)}</td><td class="n">${f(i.cost)}</td><td class="n">${f(i.qty*i.cost)}</td><td>${i.qty<=i.min?'<span class="bad">Reorder</span>':'<span class="ok">OK</span>'}</td></tr>`).join('')||'<tr><td colspan=6>No items yet</td></tr>'}</table></div></div>
${fin?`<div class="two"><div class="card"><h2>Purchase bulk stock</h2>${S.items.some(i=>i.type=='bulk')?`<form onsubmit="return addPur(event)"><label>Supplier<input name="s" required></label><label>Item<select name="i">${bulkOpts()}</select></label><label>Qty (kg)<input name="q" type="number" min="0.01" step="0.01" required></label><label>Cost / kg<input name="c" type="number" min="0" step="0.01" required></label><button class="b">Receive stock</button></form>`:'<div class="note">Add a bulk item first.</div>'}</div>
<div class="card"><h2>New item</h2><form onsubmit="return addItem(event)"><label>Name<input name="n" required></label><label>Type<select name="t" onchange="this.form.b.disabled=this.form.z.disabled=this.value=='bulk'"><option value="bulk">Bulk</option><option value="pack">Packed</option></select></label><label>Made from<select name="b" disabled>${bulkOpts()}</select></label><label>Pack size (kg)<input name="z" type="number" min="0.01" step="0.01" disabled></label><label>Reorder level<input name="m" type="number" min="0" value="50"></label><button class="b">Add</button></form></div></div>`:''}
<div class="card"><h2>Purchase history</h2><div class="scroll"><table><tr><th>Date</th><th>Supplier</th><th>Item</th><th class="n">Qty</th><th class="n">Cost</th></tr>${[...S.pur].reverse().map(p=>`<tr><td>${p.date}</td><td>${esc(p.sup)}</td><td>${esc((item(p.item)||{}).name)}</td><td class="n">${f(p.qty)}</td><td class="n">${f(p.cost)}</td></tr>`).join('')||'<tr><td colspan=5>No purchases yet</td></tr>'}</table></div></div>`},
repack(){const packs=S.items.filter(i=>i.type=='pack');
  return`<div class="card"><h2>Repacking / production entry</h2>${packs.length?`<form onsubmit="return addRp(event)"><label>Pack product<select name="p">${packs.map(i=>`<option value="${i.id}">${esc(i.name)} ← ${esc((item(i.bulk)||{}).name)}</option>`).join('')}</select></label><label>Packs produced<input name="n" type="number" min="1" required></label><label>Wastage (kg)<input name="w" type="number" min="0" step="0.01" value="0"></label><label>Packing material cost<input name="m" type="number" min="0" step="0.01" value="0"></label><button class="b">Post production</button></form><div class="note">Bulk consumed = packs × size + wastage. Pack cost = (bulk cost + material) ÷ packs, blended into average cost.</div>`:'<div class="note">Add a packed item in Inventory first.</div>'}</div>
<div class="card"><h2>Production log</h2><div class="scroll"><table><tr><th>Date</th><th>Product</th><th class="n">Packs</th><th class="n">Bulk used</th><th class="n">Wastage</th><th class="n">Material</th></tr>${[...S.rp].reverse().map(r=>{const p=item(r.pack)||{name:'?',size:1};return`<tr><td>${r.date}</td><td>${esc(p.name)}</td><td class="n">${r.n}</td><td class="n">${f(r.n*p.size+r.waste)} kg</td><td class="n">${f(r.waste)} kg</td><td class="n">${f(r.mat)}</td></tr>`}).join('')||'<tr><td colspan=6>No production yet</td></tr>'}</table></div></div>`},
exp(){const t=totals(),cats={};S.exp.filter(e=>inPeriod(e.date)).forEach(e=>cats[e.cat]=(cats[e.cat]||0)+e.amt);
  const pm=S.items.filter(i=>i.type=='pack').map(i=>{const l=S.inv.filter(x=>inPeriod(x.date)).flatMap(x=>x.lines).filter(x=>x.i==i.id),r=l.reduce((a,x)=>a+x.q*x.p,0),c=l.reduce((a,x)=>a+x.q*x.c,0);return{n:i.name,r,g:r-c,m:r?(r-c)/r*100:0}});
  return`<div style="margin-bottom:10px">${perSel()}</div><div class="two"><div class="card"><h2>Profit & Loss</h2><table style="min-width:0"><tr><td>Sales</td><td class="n">${f(t.sv)}</td></tr><tr><td>Cost of goods sold</td><td class="n">(${f(t.cogs)})</td></tr><tr><th>Gross profit</th><th class="n">${f(t.gp)}</th></tr>${Object.keys(cats).map(k=>`<tr><td>&nbsp;&nbsp;${esc(k)}</td><td class="n">(${f(cats[k])})</td></tr>`).join('')}<tr><th>Net profit</th><th class="n ${t.np>=0?'ok':'bad'}">${f(t.np)}</th></tr></table></div>
<div class="card"><h2>Margin by product</h2><div class="scroll"><table><tr><th>Product</th><th class="n">Revenue</th><th class="n">Gross</th><th class="n">Margin</th></tr>${pm.map(x=>`<tr><td>${esc(x.n)}</td><td class="n">${f(x.r)}</td><td class="n">${f(x.g)}</td><td class="n">${f(x.m)}%</td></tr>`).join('')}</table></div></div></div>
<div class="card"><h2>Add expense</h2><form onsubmit="return addExp(event)"><label>Date<input type="date" name="d" value="${TODAY}"></label><label>Category<select name="c">${['Rent','Labour','Transport','Packing material','Utilities','Marketing','Other'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Amount<input name="a" type="number" min="0.01" step="0.01" required></label><button class="b">Add</button></form></div>
<div class="card"><h2>Expense log</h2><div class="scroll"><table><tr><th>Date</th><th>Category</th><th class="n">Amount</th></tr>${[...S.exp].sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.id-a.id).slice(0,15).map(e=>`<tr><td>${e.date}</td><td>${esc(e.cat)}</td><td class="n">${f(e.amt)}</td></tr>`).join('')||'<tr><td colspan=3>No expenses yet</td></tr>'}</table></div></div>`},
users(){return`<div class="card"><h2>Users &amp; roles</h2><div class="scroll"><table><tr><th>Email</th><th>Role</th></tr>${S.users.map(u=>`<tr><td>${esc(u.email)}</td><td><select onchange="setRole('${esc(u.id)}',this.value)" ${u.id==ME.id?'disabled':''}>${['pending','sales','accountant','owner'].map(r=>`<option ${r==u.role?'selected':''}>${r}</option>`).join('')}</select></td></tr>`).join('')}</table></div>
<div class="note"><b>owner</b>: everything incl. this page · <b>accountant</b>: everything except Users · <b>sales</b>: sales, receipts, AR, stock view, repacking (no expenses or profit) · <b>pending</b>: no access.<br>To add a person: Supabase → Authentication → Users → Add user (tick “Auto confirm”). They appear here as <i>pending</i> – pick their role.</div></div>`}
};

/* ---- charts / dashboard ---- */
const PAL=['#2f6df0','#f59e0b','#f2b705','#22a861','#8b5cf6','#06b6d4','#ec4899'];
function donut(d,c1,c2){const t=d.reduce((a,x)=>a+x.v,0)||1;let o=0;const R=40,C=2*Math.PI*R;
  const arcs=d.map(x=>{const l=x.v/t*C,e=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${x.c}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"/>`;o+=l;return e}).join('');
  return`<div class="dn"><svg viewBox="0 0 120 120" width="140" height="140">${arcs}<text x="60" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="var(--tx)">${c1}</text><text x="60" y="72" text-anchor="middle" font-size="8" fill="var(--mut)">${c2}</text></svg><div class="lg">${d.map(x=>`<div><i style="background:${x.c}"></i>${esc(x.l)}<b>${(x.v/t*100).toFixed(0)}%</b></div>`).join('')}</div></div>`}
V.dash=function(){
  const t=totals(),rows=ar(),rr=Object.fromEntries(rows.map(r=>[r.id,r])),out=rows.reduce((a,r)=>a+r.out,0),od=rows.filter(r=>r.out>0&&r.over>0).reduce((a,r)=>a+r.out,0),stv=S.items.reduce((a,i)=>a+i.qty*i.cost,0),low=S.items.filter(i=>i.qty<=i.min).length;
  const M=[];for(let k=5;k>=0;k--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-k);M.push(ymd(d).slice(0,7))}
  const mm=M.map(m=>{const iv=S.inv.filter(i=>i.date.slice(0,7)==m),s=iv.reduce((a,i)=>a+i.total,0),c=iv.reduce((a,i)=>a+i.lines.reduce((b,l)=>b+l.q*l.c,0),0),e=S.exp.filter(x=>x.date.slice(0,7)==m).reduce((a,x)=>a+x.amt,0);return{m,s,e,p:s-c-e}});
  const mon=m=>new Date(m+'-15').toLocaleString('en',{month:'short'}),pv=mm[4],cu=mm[5];
  const dl=(a,b,inv)=>S.period=='month'&&b>0?`<span class="${(a>=b)!==!!inv?'ok':'bad'}">${a>=b?'▲':'▼'} ${Math.abs((a-b)/b*100).toFixed(0)}% vs last month</span>`:'&nbsp;';
  const kc=(c,ic,l,v,sub)=>`<div class="card kc" style="--kc:${c}"><div class="ic">${ic}</div><div><small>${l}</small><b>${v}</b><div class="sb">${sub}</div></div></div>`;
  const gm=t.sv?t.gp/t.sv*100:0,nm=t.sv?t.np/t.sv*100:0,cr=t.sv?t.col/t.sv*100:0;
  const all=S.inv.reduce((a,i)=>a+i.total,0),first=S.inv.reduce((a,i)=>i.date<a?i.date:a,TODAY),span=Math.max(1,(new Date(TODAY)-new Date(first))/864e5),dso=all?out/(all/span):0;
  const mx=Math.max(1,...mm.flatMap(x=>[x.s,x.e]));
  const vals=mm.map(x=>x.p),lo=Math.min(0,...vals),hi=Math.max(1,...vals),H=110,pt=vals.map((v,i)=>[i*300/(vals.length-1),H-(v-lo)/(hi-lo)*(H-12)-6]);
  const path=pt.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const cs=S.custs.map(c=>{const l=S.inv.filter(i=>i.cust==c.id&&inPeriod(i.date));return{l:c.name,v:l.reduce((a,i)=>a+i.total,0),n:l.length}}).sort((a,b)=>b.v-a.v);
  const top=cs.slice(0,4).filter(x=>x.v>0).map((x,k)=>({...x,c:PAL[k]})),oth=cs.slice(4).reduce((a,x)=>a+x.v,0);if(oth>0)top.push({l:'Other',v:oth,c:'#94a3b8'});
  const cats={};S.exp.filter(e=>inPeriod(e.date)).forEach(e=>cats[e.cat]=(cats[e.cat]||0)+e.amt);
  const ex=Object.keys(cats).map((k,i)=>({l:k,v:cats[k],c:PAL[i%7]})).sort((a,b)=>b.v-a.v);
  const ab=[0,0,0,0,0],AL=['Current','1–30','31–60','61–90','90+'],AC=['#2f6df0','#22a861','#f59e0b','#8b5cf6','#ef4444'];
  rows.forEach(r=>{if(r.out>0){const o=r.over;ab[o<=0?0:o<=30?1:o<=60?2:o<=90?3:4]+=r.out}});const am=Math.max(1,...ab);
  const st=r=>r.out<=.005?'<span class="st g">Paid</span>':r.paid>0?'<span class="st a">Partial</span>':'<span class="st r">Unpaid</span>';
  const ri=[...S.inv].sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.id-a.id).slice(0,5),rp=[...S.rec].sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.id-a.id).slice(0,5);
  return`<div style="margin-bottom:10px">${perSel()}</div>
<div class="grid">${kc('#2f6df0','💰','Total Sales','LKR '+f0(t.sv),dl(cu.s,pv.s))}${kc('#22a861','🧾','Total Expenses','LKR '+f0(t.ex),dl(cu.e,pv.e,1))}${kc('#f2b705','📈','Gross Profit','LKR '+f0(t.gp),gm.toFixed(0)+'% margin')}${kc('#ec4899','👥','Receivables (AR)','LKR '+f0(out),'Overdue LKR '+f0(od))}${kc('#8b5cf6','🏬','Stock Value','LKR '+f0(stv),low+' low-stock item(s)')}</div>
<div class="d3"><div class="card"><h2>Sales vs Expenses <small style="font-weight:400;color:var(--mut)">● <span style="color:#2f6df0">Sales</span> ● <span style="color:#f59e0b">Expenses</span></small></h2><div class="chart">${mm.map(x=>`<div class="col"><div class="bars"><i title="Sales ${f0(x.s)}" style="height:${x.s/mx*100}%;background:#2f6df0"></i><i title="Expenses ${f0(x.e)}" style="height:${x.e/mx*100}%;background:#f59e0b"></i></div><small>${mon(x.m)}</small></div>`).join('')}</div></div>
<div class="card"><h2>Monthly Profit</h2><svg viewBox="0 0 300 120" style="width:100%"><path d="${path} L300 ${H} L0 ${H}Z" fill="#22a861" opacity=".15"/><path d="${path}" fill="none" stroke="#22a861" stroke-width="2.5"/>${pt.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="#22a861"><title>${mon(mm[i].m)}: ${f0(vals[i])}</title></circle>`).join('')}</svg><div style="display:flex;justify-content:space-between;color:var(--mut);font-size:12px">${mm.map(x=>`<span>${mon(x.m)}</span>`).join('')}</div></div>
<div class="card"><h2>Revenue by Customer</h2>${top.length?donut(top,f0(t.sv),'Total Sales'):'<small>No sales yet</small>'}</div></div>
<div class="d3"><div class="card"><h2>Top 5 Customers (Sales)</h2><div class="scroll"><table><tr><th>#</th><th>Customer</th><th class="n">Sales</th><th class="n">Inv</th><th class="n">%</th></tr>${cs.slice(0,5).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.l)}</td><td class="n">${f0(x.v)}</td><td class="n">${x.n}</td><td class="n">${t.sv?(x.v/t.sv*100).toFixed(0):0}%</td></tr>`).join('')}</table></div></div>
<div class="card"><h2>Receivables Ageing <small style="font-weight:400;color:var(--mut)">(days overdue)</small></h2><div class="chart">${ab.map((v,k)=>`<div class="col"><small>${f0(v)}</small><div class="bars"><i style="height:${v/am*100}%;background:${AC[k]};width:60%;max-width:48px"></i></div><small>${AL[k]}</small></div>`).join('')}</div></div>
<div class="card"><h2>Expense Breakdown</h2>${ex.length?donut(ex,f0(t.ex),'Total Expenses'):'<small>No expenses</small>'}</div></div>
<div class="d3"><div class="card"><h2>Recent Invoices</h2><div class="scroll"><table><tr><th>Date</th><th>Invoice</th><th>Customer</th><th class="n">Amount</th><th>Status</th></tr>${ri.map(i=>`<tr><td>${i.date}</td><td>${esc(i.no)}</td><td>${esc(cust(i.cust).name)}</td><td class="n">${f0(i.total)}</td><td>${st(rr[i.id])}</td></tr>`).join('')}</table></div></div>
<div class="card"><h2>Recent Payments Received</h2><div class="scroll"><table><tr><th>Date</th><th>Customer</th><th class="n">Amount</th><th>Bank</th></tr>${rp.map(r=>`<tr><td>${r.date}</td><td>${esc(cust(r.cust).name)}</td><td class="n">${f0(r.amt)}</td><td>${esc(r.bank||'—')}</td></tr>`).join('')}</table></div></div>
<div class="card"><h2>Key Ratios</h2><div class="rt"><div><small>Gross Profit Margin</small><b>${gm.toFixed(0)}%</b></div><div><small>Net Profit Margin</small><b class="${nm>=0?'':'bad'}">${nm.toFixed(0)}%</b></div><div><small>Avg. Collection Days</small><b>${dso.toFixed(0)} days</b></div><div><small>Collection Rate</small><b>${cr.toFixed(0)}%</b></div></div></div></div>`};

/* ============ 6. Actions (all write to the shared database) ============ */
function line(){const i0=S.items[0];return`<div class="lr"><select class="li" onchange="const o=S.items.find(x=>x.id==this.value);this.parentNode.querySelector('.lp').value=(o.cost*1.25).toFixed(2)">${S.items.map(i=>`<option value="${i.id}">${esc(i.name)} (${f(i.qty)})</option>`).join('')}</select><input class="lq" type="number" step="0.01" min="0.01" placeholder="Qty" required style="width:90px"><input class="lp" type="number" step="0.01" min="0" placeholder="Price" required style="width:100px" value="${(i0.cost*1.25).toFixed(2)}"></div>`}
function addInv(e){e.preventDefault();const F=e.target,c=+F.c.value,date=F.d.value,
  L=[...F.querySelectorAll('.lr')].map(r=>({i:+r.querySelector('.li').value,q:+r.querySelector('.lq').value,p:+r.querySelector('.lp').value}));
  const cu=cust(c),total=L.reduce((a,l)=>a+l.q*l.p,0),open=ar().filter(r=>r.cust==c).reduce((a,r)=>a+r.out,0);
  return run(e,async()=>{const{error}=await sb.rpc('create_invoice',{p_customer:c,p_date:date,p_lines:L});if(error)throw error},
    open+total>cu.limit?'Invoice created – credit limit exceeded!':'Invoice created')}
function addRec(e){e.preventDefault();const F=e.target,row={customer_id:+F.c.value,rec_date:F.d.value,amount:+F.a.value,bank:F.bk.value};
  return run(e,async()=>{const{error}=await sb.from('receipts').insert(row);if(error)throw error},'Receipt recorded')}
function addCust(e){e.preventDefault();const F=e.target,row={name:F.n.value.trim(),credit_limit:+F.l.value,terms:+F.t.value};
  return run(e,async()=>{const{error}=await sb.from('customers').insert(row);if(error)throw error},'Customer added')}
function addPur(e){e.preventDefault();const F=e.target,a={p_supplier:F.s.value.trim(),p_item:+F.i.value,p_qty:+F.q.value,p_cost:+F.c.value};
  return run(e,async()=>{const{error}=await sb.rpc('receive_purchase',a);if(error)throw error},'Stock received')}
function addItem(e){e.preventDefault();const F=e.target,p=F.t.value=='pack',
  row={name:F.n.value.trim(),type:F.t.value,unit:p?'pc':'kg',qty:0,cost:0,min_qty:+F.m.value,bulk_id:p?+F.b.value:null,pack_size:p?(+F.z.value||1):null};
  if(p&&!row.bulk_id){toast('Pick the bulk item this pack is made from');return false}
  return run(e,async()=>{const{error}=await sb.from('items').insert(row);if(error)throw error},'Item added')}
function addRp(e){e.preventDefault();const F=e.target,a={p_pack:+F.p.value,p_n:+F.n.value,p_waste:+F.w.value,p_mat:+F.m.value};
  return run(e,async()=>{const{error}=await sb.rpc('post_repack',a);if(error)throw error},'Production posted')}
function addExp(e){e.preventDefault();const F=e.target,row={exp_date:F.d.value,cat:F.c.value,amount:+F.a.value};
  return run(e,async()=>{const{error}=await sb.from('expenses').insert(row);if(error)throw error},'Expense added')}
async function setRole(id,role){const{error}=await sb.from('profiles').update({role}).eq('id',id);
  if(error)toast(error.message,4000);else{toast('Role updated');await loadAll();go('users')}}

boot();
</script>
