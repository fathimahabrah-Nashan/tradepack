<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TradePack – Trading & Repacking Manager</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#6b7385;--bd:#e2e5ec;--ac:#1f6feb;--ok:#14884a;--bad:#c93232;--warn:#b7791f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b202b;--tx:#e8ebf2;--mut:#98a1b5;--bd:#2c3342;--ac:#5b9bff;--ok:#38c172;--bad:#ff6b6b;--warn:#e0a84a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b202b;--tx:#e8ebf2;--mut:#98a1b5;--bd:#2c3342;--ac:#5b9bff;--ok:#38c172;--bad:#ff6b6b;--warn:#e0a84a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header h1{font-size:17px;margin:0;margin-right:auto}
.app{display:flex}.wrap{flex:1;min-width:0}
aside#nav{width:210px;flex:none;background:#1b2740;color:#cfd8ea;padding:14px 10px;display:flex;flex-direction:column;gap:4px}
aside#nav .br{font-weight:700;font-size:17px;color:#fff;padding:6px 10px 16px}
aside#nav button{border:0;background:none;color:#cfd8ea;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer;font:inherit}
aside#nav button.on{background:#2f6df0;color:#fff}
@media(max-width:800px){.app{flex-direction:column}aside#nav{width:auto;flex-direction:row;overflow-x:auto;padding:8px}aside#nav .br{display:none}aside#nav button{white-space:nowrap}}
main{max-width:1200px;margin:0 auto;padding:16px}
.grid .card,.d3 .card{margin:0}
.d3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:12px}
.kc{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--kc) 13%,var(--card));border-color:color-mix(in srgb,var(--kc) 30%,var(--bd))}
.kc .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--kc) 25%,var(--card));flex:none}
.kc small{color:var(--mut);display:block}.kc b{font-size:20px;display:block}.sb{font-size:12px;color:var(--mut)}
.dn{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.lg{flex:1;min-width:130px;font-size:13px}.lg div{display:flex;align-items:center;gap:6px;padding:2px 0}.lg i{width:9px;height:9px;border-radius:50%;flex:none}.lg b{margin-left:auto}
.st{padding:2px 10px;border-radius:6px;font-size:12px;font-weight:600}.st.g{background:#d9f5e5;color:#14804a}.st.a{background:#fdf0cf;color:#9a6a00}.st.r{background:#fde0e0;color:#c02a2a}
.rt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rt div{background:color-mix(in srgb,var(--ac) 10%,var(--card));border-radius:10px;padding:10px}.rt small{color:var(--mut);display:block}.rt b{font-size:20px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:21px}
h2{font-size:15px;margin:0 0 10px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:480px}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px}
td.n,th.n{text-align:right}
input,select,button.b{font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
button.b{background:var(--ac);color:#fff;border:0;cursor:pointer}
button.b.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
form{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
.lines{width:100%;display:flex;flex-direction:column;gap:6px}.lr{display:flex;gap:6px;flex-wrap:wrap}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.chart{display:flex;align-items:flex-end;gap:14px;height:150px;padding-top:8px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars{display:flex;gap:3px;align-items:flex-end;height:120px;width:100%;justify-content:center}
.bars i{width:40%;max-width:26px;border-radius:4px 4px 0 0;display:block}
.pill{padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid var(--bd)}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;display:none}
</style>
</head>
<body>
<div class="app"><aside id="nav"></aside><div class="wrap"><header><h1 id="ttl">Dashboard</h1><span id="asat" style="color:var(--mut)"></span>
<button class="b g" onclick="resetDemo()">Reset demo data</button></header>
<main id="v"></main></div></div>
<div id="toast"></div>
<script>
const TABS=[['dash','Dashboard'],['sales','Sales & Receipts'],['ar','AR Ledger & Ageing'],['stock','Inventory'],['repack','Repacking'],['exp','Expenses & Profit']];
const D=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
const TODAY=D(0);
const f=n=>(+n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let uid=1000;const id=()=>++uid;
function seed(){return{tab:'dash',cust:1,period:'month',
items:[{id:1,name:'Basmati Rice (bulk)',type:'bulk',unit:'kg',qty:2000,cost:3.2,min:500},{id:2,name:'Sugar (bulk)',type:'bulk',unit:'kg',qty:1500,cost:2.1,min:400},
{id:3,name:'Rice 5kg pack',type:'pack',bulk:1,size:5,unit:'pc',qty:120,cost:17.4,min:50},{id:4,name:'Rice 1kg pack',type:'pack',bulk:1,size:1,unit:'pc',qty:30,cost:3.6,min:60},{id:5,name:'Sugar 2kg pack',type:'pack',bulk:2,size:2,unit:'pc',qty:150,cost:4.5,min:60}],
cust:[{id:1,name:'Al Noor Supermarket',limit:15000,terms:30},{id:2,name:'Fresh Mart',limit:8000,terms:30},{id:3,name:'City Catering',limit:12000,terms:45},{id:4,name:'Green Grocers',limit:5000,terms:15}].map(c=>c),
inv:[],rec:[],exp:[],pur:[],rp:[]}}
let S;
function seedData(){const s=seed();s.custs=s.cust;s.cust=1;
const mk=(c,d,l)=>{const no='INV-'+(s.inv.length+1001);s.inv.push({id:id(),no,cust:c,date:D(d),due:D(d-s.custs.find(x=>x.id==c).terms),lines:l,total:l.reduce((a,x)=>a+x.q*x.p,0)})};
mk(1,100,[{i:3,q:40,p:22,c:17.4}]);mk(2,75,[{i:5,q:50,p:5.8,c:4.5}]);mk(3,52,[{i:3,q:30,p:22,c:17.4},{i:4,q:40,p:4.6,c:3.6}]);mk(1,35,[{i:5,q:60,p:5.8,c:4.5}]);mk(4,20,[{i:4,q:100,p:4.6,c:3.6}]);mk(2,12,[{i:3,q:25,p:22,c:17.4}]);mk(3,5,[{i:5,q:80,p:5.8,c:4.5}]);mk(1,2,[{i:3,q:35,p:22,c:17.4}]);
[[1,70,880],[2,60,290],[3,40,900],[1,28,1200],[4,10,300],[2,3,400]].forEach((r,k)=>s.rec.push({id:id(),cust:r[0],date:D(r[1]),amt:r[2],bank:['BOC','Sampath','HNB','Cash','Commercial','BOC'][k]}));
[['Rent',30,1800],['Labour',28,2400],['Transport',20,650],['Packing material',15,420],['Utilities',8,380],['Labour',3,2400]].forEach(e=>s.exp.push({id:id(),cat:e[0],date:D(e[1]),amt:e[2],desc:''}));
s.pur.push({id:id(),date:D(14),sup:'Global Grains LLC',item:1,qty:1000,cost:3.2});
s.rp.push({id:id(),date:D(10),pack:3,n:60,waste:6,mat:60});
return s}
function load(){try{const r=localStorage.getItem('tradepack3');return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem('tradepack3',JSON.stringify(S))}catch(e){}}
S=load()||seedData();
function resetDemo(){S=seedData();save();go('dash')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
const item=i=>S.items.find(x=>x.id==i),cust=i=>S.custs.find(x=>x.id==i);
// ---- AR engine: FIFO allocation of receipts to invoices per customer
function ar(){const rows=[];S.custs.forEach(c=>{let pool=S.rec.filter(r=>r.cust==c.id).reduce((a,r)=>a+r.amt,0);
S.inv.filter(i=>i.cust==c.id).sort((a,b)=>a.date<b.date?-1:1).forEach(i=>{const paid=Math.min(i.total,pool);pool-=paid;
const out=i.total-paid;const age=Math.floor((new Date(TODAY)-new Date(i.date))/864e5);rows.push({...i,paid,out,age,over:Math.floor((new Date(TODAY)-new Date(i.due))/864e5)})})});return rows}
const bucket=a=>a<=30?0:a<=60?1:a<=90?2:3;
const inPeriod=d=>S.period=='all'||d.slice(0,7)==TODAY.slice(0,7);
function totals(){const sales=S.inv.filter(i=>inPeriod(i.date)),cogs=sales.reduce((a,i)=>a+i.lines.reduce((b,l)=>b+l.q*l.c,0),0),sv=sales.reduce((a,i)=>a+i.total,0);
const col=S.rec.filter(r=>inPeriod(r.date)).reduce((a,r)=>a+r.amt,0),ex=S.exp.filter(e=>inPeriod(e.date)).reduce((a,e)=>a+e.amt,0);
return{sv,cogs,gp:sv-cogs,col,ex,np:sv-cogs-ex}}
// ---- views
const IC={dash:'📊',sales:'🧾',ar:'👥',stock:'📦',repack:'🏭',exp:'💸'};
function go(t){S.tab=t;save();document.getElementById('nav').innerHTML='<div class="br">📦 TradePack</div>'+TABS.map(x=>`<button class="${x[0]==t?'on':''}" onclick="go('${x[0]}')">${IC[x[0]]} ${x[1]}</button>`).join('');document.getElementById('ttl').textContent=TABS.find(x=>x[0]==t)[1];document.getElementById('asat').textContent='As at '+TODAY;document.getElementById('v').innerHTML=V[t]()}
const kpi=(l,v,c='')=>`<div class="card kpi"><small>${l}</small><b class="${c}">${v}</b></div>`;
const perSel=()=>`<label style="display:inline-flex">Period<select onchange="S.period=this.value;go(S.tab)"><option value="month" ${S.period=='month'?'selected':''}>This month</option><option value="all" ${S.period=='all'?'selected':''}>All time</option></select></label>`;
const V={
dashOld(){const t=totals(),rows=ar(),out=rows.reduce((a,r)=>a+r.out,0),od=rows.filter(r=>r.out>0&&r.over>0).reduce((a,r)=>a+r.out,0),sv=S.items.reduce((a,i)=>a+i.qty*i.cost,0),low=S.items.filter(i=>i.qty<=i.min);
const months=[];for(let k=5;k>=0;k--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-k);months.push(d.toISOString().slice(0,7))}
const ms=months.map(m=>[m,S.inv.filter(i=>i.date.slice(0,7)==m).reduce((a,i)=>a+i.total,0),S.rec.filter(r=>r.date.slice(0,7)==m).reduce((a,r)=>a+r.amt,0)]);const mx=Math.max(1,...ms.flatMap(x=>[x[1],x[2]]));
const byC=S.custs.map(c=>({n:c.name,o:rows.filter(r=>r.cust==c.id).reduce((a,r)=>a+r.out,0),od:rows.filter(r=>r.cust==c.id&&r.out>0&&r.over>0).reduce((a,r)=>a+r.out,0)})).filter(x=>x.o>0).sort((a,b)=>b.od-a.od);
return`<div style="margin-bottom:10px">${perSel()}</div><div class="grid">${kpi('Sales',f(t.sv))}${kpi('Collections',f(t.col),'ok')}${kpi('Gross profit',f(t.gp))}${kpi('Expenses',f(t.ex))}${kpi('Net profit',f(t.np),t.np>=0?'ok':'bad')}${kpi('Total outstanding',f(out),'warn')}${kpi('Overdue',f(od),'bad')}${kpi('Stock value',f(sv))}</div>
<div class="two"><div class="card"><h2>Sales vs Collections (6 months)</h2><div class="chart">${ms.map(m=>`<div class="col"><div class="bars"><i title="Sales ${f(m[1])}" style="height:${m[1]/mx*100}%;background:var(--ac)"></i><i title="Collected ${f(m[2])}" style="height:${m[2]/mx*100}%;background:var(--ok)"></i></div><small>${m[0].slice(5)}/${m[0].slice(2,4)}</small></div>`).join('')}</div><small style="color:var(--mut)"><span style="color:var(--ac)">■</span> Sales &nbsp;<span style="color:var(--ok)">■</span> Collections</small></div>
<div class="card"><h2>Top overdue customers</h2><div class="scroll"><table><tr><th>Customer</th><th class="n">Outstanding</th><th class="n">Overdue</th></tr>${byC.map(x=>`<tr><td>${esc(x.n)}</td><td class="n">${f(x.o)}</td><td class="n bad">${f(x.od)}</td></tr>`).join('')||'<tr><td colspan=3>None 🎉</td></tr>'}</table></div></div></div>
<div class="card"><h2>⚠ Low stock alerts</h2>${low.length?low.map(i=>`<span class="pill bad">${esc(i.name)}: ${i.qty} ${i.unit}</span> `).join(''):'<span class="ok">All items above reorder level</span>'}</div>`},
sales(){const opts=S.custs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
const list=[...S.inv].sort((a,b)=>a.date<b.date?1:-1).slice(0,12),rr=Object.fromEntries(ar().map(r=>[r.id,r]));
return`<div class="two"><div class="card"><h2>New invoice</h2><form onsubmit="return addInv(event)"><label>Customer<select name="c">${opts}</select></label><label>Date<input type="date" name="d" value="${TODAY}"></label><div class="lines" id="lines">${line()}</div><button type="button" class="b g" onclick="document.getElementById('lines').insertAdjacentHTML('beforeend',line())">+ Add line</button><button class="b">Create invoice</button></form></div>
<div class="card"><h2>Receive payment</h2><form onsubmit="return addRec(event)"><label>Customer<select name="c">${opts}</select></label><label>Date<input type="date" name="d" value="${TODAY}"></label><label>Amount<input type="number" step="0.01" min="0.01" name="a" required></label><label>Bank<select name="bk"><option>BOC</option><option>Sampath</option><option>HNB</option><option>Commercial</option><option>Cash</option></select></label><button class="b">Record receipt</button></form><small style="color:var(--mut)">Receipts are auto-applied to the oldest invoices first.</small></div></div>
<div class="card"><h2>Recent invoices</h2><div class="scroll"><table><tr><th>No</th><th>Date</th><th>Customer</th><th class="n">Total</th><th class="n">Paid</th><th class="n">Balance</th><th>Status</th></tr>${list.map(i=>{const r=rr[i.id];return`<tr><td>${i.no}</td><td>${i.date}</td><td>${esc(cust(i.cust).name)}</td><td class="n">${f(i.total)}</td><td class="n">${f(r.paid)}</td><td class="n">${f(r.out)}</td><td>${r.out<=0.005?'<span class="ok">Paid</span>':r.over>0?`<span class="bad">Overdue ${r.over}d</span>`:r.paid>0?'<span class="warn">Partial</span>':'Open'}</td></tr>`}).join('')}</table></div></div>`},
ar(){const rows=ar(),c=S.cust;
const sum=S.custs.map(x=>{const r=rows.filter(i=>i.cust==x.id),b=[0,0,0,0];r.forEach(i=>{if(i.out>0)b[bucket(i.age)]+=i.out});const o=b.reduce((a,v)=>a+v,0);return{x,b,o}});
const tb=[0,1,2,3].map(k=>sum.reduce((a,s)=>a+s.b[k],0));
const ev=[...S.inv.filter(i=>i.cust==c).map(i=>({d:i.date,t:'Invoice '+i.no,dr:i.total,cr:0})),...S.rec.filter(r=>r.cust==c).map(r=>({d:r.date,t:'Receipt',dr:0,cr:r.amt}))].sort((a,b)=>a.d<b.d?-1:1);let bal=0;
return`<div class="card"><h2>Ageing report</h2><div class="scroll"><table><tr><th>Customer</th><th class="n">0–30</th><th class="n">31–60</th><th class="n">61–90</th><th class="n">90+</th><th class="n">Total</th><th class="n">Limit</th></tr>${sum.map(s=>`<tr><td>${esc(s.x.name)}</td>${s.b.map((v,k)=>`<td class="n ${k>1&&v?'bad':''}">${f(v)}</td>`).join('')}<td class="n"><b>${f(s.o)}</b></td><td class="n ${s.o>s.x.limit?'bad':''}">${f(s.x.limit)}</td></tr>`).join('')}<tr><th>Total</th>${tb.map(v=>`<th class="n">${f(v)}</th>`).join('')}<th class="n">${f(tb.reduce((a,v)=>a+v,0))}</th><th></th></tr></table></div></div>
<div class="card"><h2>Customer ledger</h2><label style="margin-bottom:8px;max-width:280px">Customer<select onchange="S.cust=+this.value;go('ar')">${S.custs.map(x=>`<option value="${x.id}" ${x.id==c?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><div class="scroll"><table><tr><th>Date</th><th>Particulars</th><th class="n">Debit</th><th class="n">Credit</th><th class="n">Balance</th></tr>${ev.map(e=>{bal+=e.dr-e.cr;return`<tr><td>${e.d}</td><td>${e.t}</td><td class="n">${e.dr?f(e.dr):''}</td><td class="n ok">${e.cr?f(e.cr):''}</td><td class="n">${f(bal)}</td></tr>`}).join('')}</table></div></div>
<div class="card"><h2>Add customer</h2><form onsubmit="return addCust(event)"><label>Name<input name="n" required></label><label>Credit limit<input name="l" type="number" value="10000"></label><label>Terms (days)<input name="t" type="number" value="30"></label><button class="b">Add</button></form></div>`},
stock(){return`<div class="card"><h2>Stock position</h2><div class="scroll"><table><tr><th>Item</th><th>Type</th><th class="n">Qty</th><th class="n">Avg cost</th><th class="n">Value</th><th>Status</th></tr>${S.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.type=='bulk'?'Bulk':'Packed'}</td><td class="n">${f(i.qty)} ${i.unit}</td><td class="n">${f(i.cost)}</td><td class="n">${f(i.qty*i.cost)}</td><td>${i.qty<=i.min?'<span class="bad">Reorder</span>':'<span class="ok">OK</span>'}</td></tr>`).join('')}</table></div></div>
<div class="two"><div class="card"><h2>Purchase bulk stock</h2><form onsubmit="return addPur(event)"><label>Supplier<input name="s" required></label><label>Item<select name="i">${S.items.filter(i=>i.type=='bulk').map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</select></label><label>Qty (kg)<input name="q" type="number" step="0.01" required></label><label>Cost / kg<input name="c" type="number" step="0.01" required></label><button class="b">Receive stock</button></form></div>
<div class="card"><h2>New item</h2><form onsubmit="return addItem(event)"><label>Name<input name="n" required></label><label>Type<select name="t" onchange="this.form.b.disabled=this.form.z.disabled=this.value=='bulk'"><option value="bulk">Bulk</option><option value="pack">Packed</option></select></label><label>Made from<select name="b" disabled>${S.items.filter(i=>i.type=='bulk').map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</select></label><label>Pack size (kg)<input name="z" type="number" step="0.01" disabled></label><label>Reorder level<input name="m" type="number" value="50"></label><button class="b">Add</button></form></div></div>
<div class="card"><h2>Purchase history</h2><div class="scroll"><table><tr><th>Date</th><th>Supplier</th><th>Item</th><th class="n">Qty</th><th class="n">Cost</th></tr>${[...S.pur].reverse().map(p=>`<tr><td>${p.date}</td><td>${esc(p.sup)}</td><td>${esc(item(p.item).name)}</td><td class="n">${f(p.qty)}</td><td class="n">${f(p.cost)}</td></tr>`).join('')}</table></div></div>`},
repack(){const packs=S.items.filter(i=>i.type=='pack');return`<div class="card"><h2>Repacking / production entry</h2><form onsubmit="return addRp(event)"><label>Pack product<select name="p">${packs.map(i=>`<option value="${i.id}">${esc(i.name)} ← ${esc(item(i.bulk).name)}</option>`).join('')}</select></label><label>Packs produced<input name="n" type="number" min="1" required></label><label>Wastage (kg)<input name="w" type="number" step="0.01" value="0"></label><label>Packing material cost<input name="m" type="number" step="0.01" value="0"></label><button class="b">Post production</button></form><small style="color:var(--mut)">Bulk consumed = packs × size + wastage. Pack cost = (bulk cost + material) ÷ packs, blended into average cost.</small></div>
<div class="card"><h2>Production log</h2><div class="scroll"><table><tr><th>Date</th><th>Product</th><th class="n">Packs</th><th class="n">Bulk used</th><th class="n">Wastage</th><th class="n">Material</th></tr>${[...S.rp].reverse().map(r=>{const p=item(r.pack);return`<tr><td>${r.date}</td><td>${esc(p.name)}</td><td class="n">${r.n}</td><td class="n">${f(r.n*p.size+r.waste)} kg</td><td class="n">${f(r.waste)} kg</td><td class="n">${f(r.mat)}</td></tr>`}).join('')}</table></div></div>`},
exp(){const t=totals(),cats={};S.exp.filter(e=>inPeriod(e.date)).forEach(e=>cats[e.cat]=(cats[e.cat]||0)+e.amt);
const pm=S.items.filter(i=>i.type=='pack').map(i=>{const l=S.inv.filter(x=>inPeriod(x.date)).flatMap(x=>x.lines).filter(x=>x.i==i.id),r=l.reduce((a,x)=>a+x.q*x.p,0),c=l.reduce((a,x)=>a+x.q*x.c,0);return{n:i.name,r,g:r-c,m:r?(r-c)/r*100:0}});
return`<div style="margin-bottom:10px">${perSel()}</div><div class="two"><div class="card"><h2>Profit & Loss</h2><table style="min-width:0"><tr><td>Sales</td><td class="n">${f(t.sv)}</td></tr><tr><td>Cost of goods sold</td><td class="n">(${f(t.cogs)})</td></tr><tr><th>Gross profit</th><th class="n">${f(t.gp)}</th></tr>${Object.keys(cats).map(k=>`<tr><td>&nbsp;&nbsp;${esc(k)}</td><td class="n">(${f(cats[k])})</td></tr>`).join('')}<tr><th>Net profit</th><th class="n ${t.np>=0?'ok':'bad'}">${f(t.np)}</th></tr></table></div>
<div class="card"><h2>Margin by product</h2><div class="scroll"><table><tr><th>Product</th><th class="n">Revenue</th><th class="n">Gross</th><th class="n">Margin</th></tr>${pm.map(x=>`<tr><td>${esc(x.n)}</td><td class="n">${f(x.r)}</td><td class="n">${f(x.g)}</td><td class="n">${f(x.m)}%</td></tr>`).join('')}</table></div></div></div>
<div class="card"><h2>Add expense</h2><form onsubmit="return addExp(event)"><label>Date<input type="date" name="d" value="${TODAY}"></label><label>Category<select name="c">${['Rent','Labour','Transport','Packing material','Utilities','Marketing','Other'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Amount<input name="a" type="number" step="0.01" required></label><button class="b">Add</button></form></div>
<div class="card"><h2>Expense log</h2><div class="scroll"><table><tr><th>Date</th><th>Category</th><th class="n">Amount</th></tr>${[...S.exp].sort((a,b)=>a.date<b.date?1:-1).slice(0,15).map(e=>`<tr><td>${e.date}</td><td>${esc(e.cat)}</td><td class="n">${f(e.amt)}</td></tr>`).join('')}</table></div></div>`}};
const f0=n=>Math.round(+n||0).toLocaleString();
const PAL=['#2f6df0','#f59e0b','#f2b705','#22a861','#8b5cf6','#06b6d4','#ec4899'];
function donut(d,c1,c2){const t=d.reduce((a,x)=>a+x.v,0)||1;let o=0;const R=40,C=2*Math.PI*R;
const arcs=d.map(x=>{const l=x.v/t*C,e=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${x.c}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"/>`;o+=l;return e}).join('');
return`<div class="dn"><svg viewBox="0 0 120 120" width="140" height="140">${arcs}<text x="60" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="var(--tx)">${c1}</text><text x="60" y="72" text-anchor="middle" font-size="8" fill="var(--mut)">${c2}</text></svg><div class="lg">${d.map(x=>`<div><i style="background:${x.c}"></i>${esc(x.l)}<b>${(x.v/t*100).toFixed(0)}%</b></div>`).join('')}</div></div>`}
V.dash=function(){
const t=totals(),rows=ar(),rr=Object.fromEntries(rows.map(r=>[r.id,r])),out=rows.reduce((a,r)=>a+r.out,0),od=rows.filter(r=>r.out>0&&r.over>0).reduce((a,r)=>a+r.out,0),stv=S.items.reduce((a,i)=>a+i.qty*i.cost,0),low=S.items.filter(i=>i.qty<=i.min).length;
const M=[];for(let k=5;k>=0;k--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-k);M.push(d.toISOString().slice(0,7))}
const mm=M.map(m=>{const iv=S.inv.filter(i=>i.date.slice(0,7)==m),s=iv.reduce((a,i)=>a+i.total,0),c=iv.reduce((a,i)=>a+i.lines.reduce((b,l)=>b+l.q*l.c,0),0),e=S.exp.filter(x=>x.date.slice(0,7)==m).reduce((a,x)=>a+x.amt,0);return{m,s,e,p:s-c-e}});
const mon=m=>new Date(m+'-15').toLocaleString('en',{month:'short'}),pv=mm[4],cu=mm[5];
const dl=(a,b,inv)=>S.period=='month'&&b>0?`<span class="${(a>=b)!==!!inv?'ok':'bad'}">${a>=b?'▲':'▼'} ${Math.abs((a-b)/b*100).toFixed(0)}% vs last month</span>`:'&nbsp;';
const kc=(c,ic,l,v,sub)=>`<div class="card kc" style="--kc:${c}"><div class="ic">${ic}</div><div><small>${l}</small><b>${v}</b><div class="sb">${sub}</div></div></div>`;
const gm=t.sv?t.gp/t.sv*100:0,nm=t.sv?t.np/t.sv*100:0,cr=t.sv?t.col/t.sv*100:0;
const all=S.inv.reduce((a,i)=>a+i.total,0),first=S.inv.reduce((a,i)=>i.date<a?i.date:a,TODAY),span=Math.max(1,(new Date(TODAY)-new Date(first))/864e5),dso=all?out/(all/span):0;
const mx=Math.max(1,...mm.flatMap(x=>[x.s,x.e]));
const vals=mm.map(x=>x.p),lo=Math.min(0,...vals),hi=Math.max(1,...vals),H=110,pt=vals.map((v,i)=>[i*300/(vals.length-1),H-(v-lo)/(hi-lo)*(H-12)-6]);
const path=pt.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
const cs=S.custs.map(c=>{const l=S.inv.filter(i=>i.cust==c.id&&inPeriod(i.date));return{l:c.name,v:l.reduce((a,i)=>a+i.total,0),n:l.length}}).sort((a,b)=>b.v-a.v);
const top=cs.slice(0,4).filter(x=>x.v>0).map((x,k)=>({...x,c:PAL[k]})),oth=cs.slice(4).reduce((a,x)=>a+x.v,0);if(oth>0)top.push({l:'Other',v:oth,c:'#94a3b8'});
const cats={};S.exp.filter(e=>inPeriod(e.date)).forEach(e=>cats[e.cat]=(cats[e.cat]||0)+e.amt);
const ex=Object.keys(cats).map((k,i)=>({l:k,v:cats[k],c:PAL[i%7]})).sort((a,b)=>b.v-a.v);
const ab=[0,0,0,0,0],AL=['Current','1–30','31–60','61–90','90+'],AC=['#2f6df0','#22a861','#f59e0b','#8b5cf6','#ef4444'];
rows.forEach(r=>{if(r.out>0){const o=r.over;ab[o<=0?0:o<=30?1:o<=60?2:o<=90?3:4]+=r.out}});const am=Math.max(1,...ab);
const st=r=>r.out<=.005?'<span class="st g">Paid</span>':r.paid>0?'<span class="st a">Partial</span>':'<span class="st r">Unpaid</span>';
const ri=[...S.inv].sort((a,b)=>a.date<b.date?1:-1).slice(0,5),rp=[...S.rec].sort((a,b)=>a.date<b.date?1:-1).slice(0,5);
return`<div style="margin-bottom:10px">${perSel()}</div>
<div class="grid">${kc('#2f6df0','💰','Total Sales','LKR '+f0(t.sv),dl(cu.s,pv.s))}${kc('#22a861','🧾','Total Expenses','LKR '+f0(t.ex),dl(cu.e,pv.e,1))}${kc('#f2b705','📈','Gross Profit','LKR '+f0(t.gp),gm.toFixed(0)+'% margin')}${kc('#ec4899','👥','Receivables (AR)','LKR '+f0(out),'Overdue LKR '+f0(od))}${kc('#8b5cf6','🏬','Stock Value','LKR '+f0(stv),low+' low-stock item(s)')}</div>
<div class="d3"><div class="card"><h2>Sales vs Expenses <small style="font-weight:400;color:var(--mut)">● <span style="color:#2f6df0">Sales</span> ● <span style="color:#f59e0b">Expenses</span></small></h2><div class="chart">${mm.map(x=>`<div class="col"><div class="bars"><i title="Sales ${f0(x.s)}" style="height:${x.s/mx*100}%;background:#2f6df0"></i><i title="Expenses ${f0(x.e)}" style="height:${x.e/mx*100}%;background:#f59e0b"></i></div><small>${mon(x.m)}</small></div>`).join('')}</div></div>
<div class="card"><h2>Monthly Profit</h2><svg viewBox="0 0 300 120" style="width:100%"><path d="${path} L300 ${H} L0 ${H}Z" fill="#22a861" opacity=".15"/><path d="${path}" fill="none" stroke="#22a861" stroke-width="2.5"/>${pt.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="#22a861"><title>${mon(mm[i].m)}: ${f0(vals[i])}</title></circle>`).join('')}</svg><div style="display:flex;justify-content:space-between;color:var(--mut);font-size:12px">${mm.map(x=>`<span>${mon(x.m)}</span>`).join('')}</div></div>
<div class="card"><h2>Revenue by Customer</h2>${donut(top,f0(t.sv),'Total Sales')}</div></div>
<div class="d3"><div class="card"><h2>Top 5 Customers (Sales)</h2><div class="scroll"><table><tr><th>#</th><th>Customer</th><th class="n">Sales</th><th class="n">Inv</th><th class="n">%</th></tr>${cs.slice(0,5).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.l)}</td><td class="n">${f0(x.v)}</td><td class="n">${x.n}</td><td class="n">${t.sv?(x.v/t.sv*100).toFixed(0):0}%</td></tr>`).join('')}</table></div></div>
<div class="card"><h2>Receivables Ageing <small style="font-weight:400;color:var(--mut)">(days overdue)</small></h2><div class="chart">${ab.map((v,k)=>`<div class="col"><small>${f0(v)}</small><div class="bars"><i style="height:${v/am*100}%;background:${AC[k]};width:60%;max-width:48px"></i></div><small>${AL[k]}</small></div>`).join('')}</div></div>
<div class="card"><h2>Expense Breakdown</h2>${ex.length?donut(ex,f0(t.ex),'Total Expenses'):'<small>No expenses</small>'}</div></div>
<div class="d3"><div class="card"><h2>Recent Invoices</h2><div class="scroll"><table><tr><th>Date</th><th>Invoice</th><th>Customer</th><th class="n">Amount</th><th>Status</th></tr>${ri.map(i=>`<tr><td>${i.date}</td><td>${i.no}</td><td>${esc(cust(i.cust).name)}</td><td class="n">${f0(i.total)}</td><td>${st(rr[i.id])}</td></tr>`).join('')}</table></div></div>
<div class="card"><h2>Recent Payments Received</h2><div class="scroll"><table><tr><th>Date</th><th>Customer</th><th class="n">Amount</th><th>Bank</th></tr>${rp.map(r=>`<tr><td>${r.date}</td><td>${esc(cust(r.cust).name)}</td><td class="n">${f0(r.amt)}</td><td>${r.bank||'—'}</td></tr>`).join('')}</table></div></div>
<div class="card"><h2>Key Ratios</h2><div class="rt"><div><small>Gross Profit Margin</small><b>${gm.toFixed(0)}%</b></div><div><small>Net Profit Margin</small><b class="${nm>=0?'':'bad'}">${nm.toFixed(0)}%</b></div><div><small>Avg. Collection Days</small><b>${dso.toFixed(0)} days</b></div><div><small>Collection Rate</small><b>${cr.toFixed(0)}%</b></div></div></div></div>`};
// ---- actions
function line(){return`<div class="lr"><select class="li" onchange="const o=S.items.find(x=>x.id==this.value);this.parentNode.querySelector('.lp').value=(o.cost*1.25).toFixed(2)">${S.items.map(i=>`<option value="${i.id}">${esc(i.name)} (${f(i.qty)})</option>`).join('')}</select><input class="lq" type="number" step="0.01" min="0.01" placeholder="Qty" required style="width:90px"><input class="lp" type="number" step="0.01" placeholder="Price" required style="width:100px" value="${(S.items[0].cost*1.25).toFixed(2)}"></div>`}
function addInv(e){e.preventDefault();const F=e.target,c=+F.c.value,L=[...F.querySelectorAll('.lr')].map(r=>({i:+r.querySelector('.li').value,q:+r.querySelector('.lq').value,p:+r.querySelector('.lp').value}));
const need={};L.forEach(l=>need[l.i]=(need[l.i]||0)+l.q);for(const k in need)if(item(k).qty<need[k]){toast('Not enough stock: '+item(k).name);return false}
L.forEach(l=>{const it=item(l.i);l.c=it.cost;it.qty-=l.q});const cu=cust(c),total=L.reduce((a,l)=>a+l.q*l.p,0),open=ar().filter(r=>r.cust==c).reduce((a,r)=>a+r.out,0);
const dt=new Date(F.d.value);dt.setDate(dt.getDate()+cu.terms);S.inv.push({id:id(),no:'INV-'+(1001+S.inv.length),cust:c,date:F.d.value,due:dt.toISOString().slice(0,10),lines:L,total});
save();go('sales');toast(open+total>cu.limit?'Invoice created – credit limit exceeded!':'Invoice created');return false}
function addRec(e){e.preventDefault();const F=e.target;S.rec.push({id:id(),cust:+F.c.value,date:F.d.value,amt:+F.a.value,bank:F.bk.value});save();go('sales');toast('Receipt recorded');return false}
function addCust(e){e.preventDefault();const F=e.target;S.custs.push({id:id(),name:F.n.value,limit:+F.l.value,terms:+F.t.value});save();go('ar');return false}
function addPur(e){e.preventDefault();const F=e.target,it=item(F.i.value),q=+F.q.value,c=+F.c.value;it.cost=(it.qty*it.cost+q*c)/(it.qty+q);it.qty+=q;S.pur.push({id:id(),date:TODAY,sup:F.s.value,item:it.id,qty:q,cost:c});save();go('stock');toast('Stock received');return false}
function addItem(e){e.preventDefault();const F=e.target,p=F.t.value=='pack';S.items.push({id:id(),name:F.n.value,type:F.t.value,unit:p?'pc':'kg',qty:0,cost:0,min:+F.m.value,...(p?{bulk:+F.b.value,size:+F.z.value||1}:{})});save();go('stock');return false}
function addRp(e){e.preventDefault();const F=e.target,p=item(F.p.value),b=item(p.bulk),n=+F.n.value,w=+F.w.value,m=+F.m.value,use=n*p.size+w;
if(b.qty<use){toast('Not enough bulk stock ('+f(b.qty)+' kg)');return false}
const unitCost=(use*b.cost+m)/n;p.cost=(p.qty*p.cost+n*unitCost)/(p.qty+n);p.qty+=n;b.qty-=use;S.rp.push({id:id(),date:TODAY,pack:p.id,n,waste:w,mat:m});save();go('repack');toast('Production posted');return false}
function addExp(e){e.preventDefault();const F=e.target;S.exp.push({id:id(),date:F.d.value,cat:F.c.value,amt:+F.a.value,desc:''});save();go('exp');return false}
go(S.tab||'dash');
</script>
